<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacto · Clevmarket</title><meta name="description" content="Escríbenos a Clevmarket."><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="nav"><div class="container nav__in"><a class="nav__logo" href="index.html">Clevmarket</a><nav class="nav__links" aria-label="Principal"><a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a><a href="contacto.html">Contacto</a></nav></div></header>
<main>
<section class="section"><div class="container legal"><h1>Contacto</h1><p>Respondemos en un máximo de 2 días hábiles.</p>
<form id="form-contacto" class="form" action="https://formspree.io/f/TU_ID_DE_FORMSPREE" method="POST">
<label class="field">Nombre<input name="nombre" required autocomplete="name"></label>
<label class="field">Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
<label class="field">Motivo<select name="motivo" required><option value="">Elige un motivo</option><option>Consulta general</option><option>Reportar un enlace roto</option><option>Alianzas comerciales</option><option>Privacidad de datos</option></select></label>
<label class="field">Mensaje<textarea name="mensaje" rows="5" required minlength="10"></textarea></label>
<button class="btn" type="submit">Enviar mensaje</button></form></div></section>
</main>
<footer class="footer"><div class="container footer__in"><p>© 2026 Clevmarket. Podemos recibir una comisión por las compras hechas desde nuestros enlaces, sin costo extra para ti.</p><nav aria-label="Legal"><a href="terminos.html">Términos</a><a href="privacidad.html">Privacidad</a><a href="contacto.html">Contacto</a></nav></div></footer>
<script src="main.js"></script>
</body></html>
